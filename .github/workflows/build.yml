name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build
        run: gradle assembleRelease --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk clean-home.apk
      - uses: actions/upload-artifact@v4
        with:
          name: clean-home
          path: clean-home.apk
      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest clean-home.apk \
            --title "Clean Home (build ${{ github.run_number }})" \
            --notes "Сборка из коммита ${{ github.sha }}"
